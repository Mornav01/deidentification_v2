[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deid"
version = "1.0.0"
requires-python = ">=3.11"

[project.scripts]
deid = "deid.cli.app:app"

[tool.setuptools.packages.find]
include = ["deid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
